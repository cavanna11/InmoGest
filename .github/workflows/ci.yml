# Compuertas de docs/TESTING.md. No despliega ni toca producción.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: ci
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Typecheck, lint, unit, build, seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Variables públicas sin secretos
        run: npm run check:env
      - name: Dependencias sin vulnerabilidades altas
        run: npm audit --audit-level=high

  database:
    name: Migraciones, pgTAP e integración (Supabase local efímero)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Levantar Supabase local (aplica migraciones y seed)
        run: >
          node node_modules/supabase/dist/supabase.js start --workdir backend
          -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta
      - name: Exportar credenciales locales (solo de este contenedor efímero)
        run: node scripts/ci-supabase-env.mjs
      - name: db:push no tiene migraciones pendientes
        run: npm run db:push -- --dry-run
      - run: npm run test:db
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright, con autenticación sobre Supabase local)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Levantar Supabase local con Auth y Mailpit (datos de prueba aislados)
        run: >
          node node_modules/supabase/dist/supabase.js start --workdir backend
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta
      - name: Exportar credenciales locales (solo de este contenedor efímero)
        run: node scripts/ci-supabase-env.mjs
      # El build incrusta las variables NEXT_PUBLIC_*: se hace después de exportarlas.
      - run: npm run build
      - run: npm run e2e:install -- --with-deps
      - run: npm run test:e2e
        env:
          CI: 'true'
          E2E_AUTH: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
